# Evolution API para el canal WhatsApp de Emi.
# Funciona en Coolify ("Docker Compose" → pegar este archivo) o en cualquier servidor con Docker.
services:
  evolution:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:latest}
    restart: unless-stopped
    depends_on: [postgres, redis]
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_pg:
  evolution_redis:
